name: Build & Release Debug APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating temporary CI debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify generated Debug APK
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated under app/build/outputs/apk/debug."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Generated Debug APK at '$APK_PATH' is empty (0 bytes)."
            exit 1
          fi
          APK_SIZE=$(wc -c < "$APK_PATH")
          echo "Verified Debug APK path: $APK_PATH"
          echo "Verified Debug APK size: $APK_SIZE bytes"
          ls -lh "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jani-ai-debug-apk-${{ github.run_number }}
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Jani AI ${{ github.ref_name }}"
          body: |
            Automated Debug APK release for **Jani AI** (`${{ github.ref_name }}`).

            ### Highlights
            - Multilingual voice-first AI assistant (English, Urdu, Hindi) powered by Firebase AI Logic (`gemini-3.8-flash`)
            - Persistent per-user Firestore memory vault & Google Sign-In
            - Vision Lab image generation (`gemini-nano-banana-2.1`) & multimodal photo analysis
            - Built automatically via GitHub Actions (`./gradlew assembleDebug`)
          files: ${{ steps.verify_apk.outputs.apk_path }}
          draft: false
          prerelease: false
